name: Build STM32_Linux_Telemetry

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'STM32_Linux_Telemetry/**'
      - '.github/workflows/stm32_linux_telemetry_build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'STM32_Linux_Telemetry/**'
      - '.github/workflows/stm32_linux_telemetry_build.yml'  
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build STM32_Linux_Telemetry for stm32_devkitc_wroom
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.4

    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Zephyr   # checked out into a subfolder so west can manage the workspace
      - name: Initialize west workspace
        run: |
          west init -l Zephyr
          west update --narrow --fetch-opt=--depth=1
      - name: Export Zephyr CMake package
        run: |
          west zephyr-export
      - name: Build STM32_Linux_Telemetry
        run: |
          west build \
            --pristine \
            --board nucleo_f303re \
            Zephyr/STM32_Linux_Telemetry/firmware
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: STM32_Linux_Telemetry_nucleo_f303re_${{ github.sha }}
          path: build/zephyr/zephyr.bin
          retention-days: 30
