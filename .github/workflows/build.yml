name: Build ESP32 BLE Beacon

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BOARD: esp32_devkitc_wroom
      APP_PATH: BLE_Beacon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build gperf ccache dfu-util \
            device-tree-compiler wget python3-pip \
            python3-setuptools python3-wheel xz-utils file make gcc \
            libsdl2-dev libmagic1

      - name: Install west
        run: pip install west

      - name: Initialize west workspace (uses YOUR west.yml)
        run: |
          west init -l .
          west update

      - name: Install Python dependencies
        run: |
          pip install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/latest/download/zephyr-sdk_linux-x86_64.tar.xz
          tar xvf zephyr-sdk_linux-x86_64.tar.xz
          cd zephyr-sdk-*
          sudo ./setup.sh -t all -h -c

      - name: Export Zephyr environment
        run: |
          echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr" >> $GITHUB_ENV

      - name: Build BLE_Beacon
        run: |
          west build -b $BOARD $APP_PATH --pristine

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ble-beacon-esp32
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/bootloader.bin
            build/zephyr/partition_table.bin
