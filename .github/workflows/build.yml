name: Build ESP32 BLE Beacon

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # This puts your 'zephyr_repo' contents into a folder named 'app'
          path: app 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Zephyr Project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 0.17.0
          modules: |
            hal_espressif

      - name: Build BLE Beacon
        run: |
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          export ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk
          west build -p always -b esp32_devkitc/esp32/procpu app/BLE_Beacon

      - name: Upload Flashable Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/merged.bin
