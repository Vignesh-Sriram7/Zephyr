name: Build ESP32 BLE Beacon (Docker)
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    # This is the "magic" line - it runs the whole job inside the Zephyr container
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Initialize West Workspace
        # Inside the container, 'west' is already installed and ready
        run: |
          west init -l app
          west update
          # This pulls the ESP32-specific binary blobs (WiFi/Bluetooth)
          west blobs fetch hal_espressif

      - name: Build BLE Beacon
        run: |
          # No manual SDK or toolchain exports needed!
          west build -p always -b esp32_devkitc/esp32/procpu app/BLE_Beacon

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/merged.bin
