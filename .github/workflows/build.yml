name: Build ESP32 BLE Beacon

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Zephyr Base (No Toolchains here)
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 0.17.0
          # We leave toolchains EMPTY to let the action finish successfully

      - name: Install ESP32 (xtensa) Toolchain
        run: |
          # Download prebuilt Zephyr-supported xtensa toolchain
          wget https://dl.espressif.com/dl/esp-idf/esp32/xtensa-esp32-elf-linux64-1.80.0.tar.gz
          tar -xzf xtensa-esp32-elf-linux64-1.80.0.tar.gz -C $HOME
          echo "$HOME/xtensa-esp32-elf/bin" >> $GITHUB_PATH
          echo "ZEPHYR_TOOLCHAIN_VARIANT=xtensa-esp" >> $GITHUB_ENV

      - name: Build BLE Beacon
        run: |
          west build -p always -b esp32 app/BLE_Beacon
          
      - name: Upload Flashable Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/merged.bin
