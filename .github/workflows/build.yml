name: Build ESP32 BLE Beacon

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:main
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Initialize West workspace
        run: |
          west init -l app
          west update

      - name: Set environment
        run: |
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> $GITHUB_ENV
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk" >> $GITHUB_ENV

      - name: Build BLE Beacon
        run: |
          west build -p always \
            -b esp32_devkitc/esp32/procpu \
            app/BLE_Beacon

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: build/zephyr/*.bin
