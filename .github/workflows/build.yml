name: Build Zephyr BLE_Beacon (ESP32)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build BLE_Beacon for esp32_devkitc_wroom
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.4

    env:
      CMAKE_PREFIX_PATH: /opt/toolchains

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout your application repo
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Zephyr   # checked out into a subfolder so west can manage the workspace

      # ------------------------------------------------------------------ #
      # 2. Set up the west workspace using your west.yml manifest
      # ------------------------------------------------------------------ #
      - name: Initialize west workspace
        run: |
          west init -l Zephyr
          west update --narrow --fetch-opt=--depth=1

      # ------------------------------------------------------------------ #
      # 3. Export Zephyr CMake package so the build system can find it
      # ------------------------------------------------------------------ #
      - name: Export Zephyr CMake package
        run: |
          west zephyr-export

      # ------------------------------------------------------------------ #
      # 4. Build the application
      # ------------------------------------------------------------------ #
      - name: Build BLE_Beacon
        run: |
          west build \
            --pristine \
            --board esp32_devkitc_wroom/esp32/procpu \
            Zephyr/BLE_Beacon \
            -- \
            -DCONFIG_BT=y

      # ------------------------------------------------------------------ #
      # 5. Upload zephyr.bin as a build artifact
      # ------------------------------------------------------------------ #
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: ble_beacon_esp32_${{ github.sha }}
          path: build/zephyr/zephyr.bin
          retention-days: 30
