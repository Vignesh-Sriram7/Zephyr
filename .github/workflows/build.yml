name: Build ESP32 BLE Beacon

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app  # puts repo contents into 'app' folder

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Zephyr Project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 1.0.1   # match installed SDK version
          modules: |
            hal_espressif

      - name: Install Xtensa Toolchain for ESP32
        run: |
          $HOME/zephyr-sdk/setup.sh -t xtensa-espressif-elf -c

      - name: Set Zephyr SDK Environment
        run: |
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> $GITHUB_ENV
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> $GITHUB_ENV

      - name: Build BLE Beacon
        run: |
          west build -p always -b esp32_devkitc/esp32/procpu app/BLE_Beacon

      - name: Upload Flashable Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/merged.bin
