name: Build ESP32 BLE Beacon

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python for Zephyr/west
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3️⃣ Install Zephyr base (without toolchains)
      - name: Setup Zephyr Base
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 0.17.0
          toolchains: ''  # skip installing Zephyr SDK toolchains

      # 4️⃣ Cache prebuilt Xtensa toolchain for faster builds
      - name: Cache ESP32 Toolchain
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/.xtensa-esp32-elf
          key: esp32-toolchain-v12-{{ runner.os }}
          restore-keys: |
            esp32-toolchain-v12-

      - name: Install ESP32 (xtensa) Toolchain
        run: |
          TOOLCHAIN_URL="https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32-elf-12.2.0_20230208-x86_64-linux-gnu.tar.xz"
          TOOLCHAIN_SHA="4d2e02ef47f1a93a4dcfdbaecd486adfaab4c0e26deea2c18d6385527f39f864"
          
          # Download
          wget $TOOLCHAIN_URL -O xtensa-esp32-elf.tar.xz
          
          # Verify SHA256
          echo "$TOOLCHAIN_SHA  xtensa-esp32-elf.tar.xz" | sha256sum -c -
          
          # Extract to HOME
          tar -xJf xtensa-esp32-elf.tar.xz -C $HOME
          
          # Add toolchain to PATH
          echo "$HOME/xtensa-esp32-elf/bin" >> $GITHUB_PATH
          
          # Tell Zephyr to use ESP32 variant
          echo "ZEPHYR_TOOLCHAIN_VARIANT=xtensa-esp" >> $GITHUB_ENV
          
      # 6️⃣ Set environment for Zephyr to find toolchain
      - name: Set ESP32 Toolchain Environment
        run: |
          echo "${GITHUB_WORKSPACE}/.xtensa-esp32-elf/bin" >> $GITHUB_PATH
          echo "ZEPHYR_TOOLCHAIN_VARIANT=xtensa-esp" >> $GITHUB_ENV

      # 7️⃣ Build the BLE Beacon
      - name: Build BLE Beacon
        run: |
          west build -p always -b esp32_devkitc/esp32/propcu app/BLE_Beacon

      # 8️⃣ Upload flashable binaries
      - name: Upload Flashable Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: build/zephyr/zephyr.bin
