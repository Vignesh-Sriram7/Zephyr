name: Build ESP32 BLE Beacon

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Zephyr Base (No Toolchains here)
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 0.17.0
          # We leave toolchains EMPTY to let the action finish successfully

      - name: Manual Toolchain Install
        run: |
          # Find the SDK setup script anywhere in the workspace
          SDK_SETUP=$(find $GITHUB_WORKSPACE -name "setup.sh" | grep "zephyr-sdk")
          SDK_DIR=$(dirname $SDK_SETUP)
          
          echo "Found SDK at: $SDK_DIR"
          
          # Run the installer for the ESP32 compiler
          $SDK_SETUP -t xtensa-espressif-elf -c
          
          # Save the path for the next step
          echo "ZEPHYR_SDK_INSTALL_DIR=$SDK_DIR" >> $GITHUB_ENV

      - name: Build BLE Beacon
        run: |
          # The path was saved to GITHUB_ENV in the previous step
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          
          west build -p always -b esp32_devkitc/esp32/procpu app/BLE_Beacon
          
      - name: Upload Flashable Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/merged.bin
