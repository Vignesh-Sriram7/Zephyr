name: Build ESP32 BLE Beacon

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:main
      options: --user root

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      # 2️⃣ Cache Zephyr SDK
      - name: Cache Zephyr SDK
        uses: actions/cache@v3
        with:
          path: /opt/zephyr-sdk
          key: zephyr-sdk-0.15.2
          restore-keys: |
            zephyr-sdk-

      # 3️⃣ Install Zephyr SDK if not cached
      - name: Install Zephyr SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ZEPHYR_SDK_VERSION=0.15.2
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$ZEPHYR_SDK_VERSION/zephyr-sdk-$ZEPHYR_SDK_VERSION-linux-x86_64-setup.run
          chmod +x zephyr-sdk-$ZEPHYR_SDK_VERSION-linux-x86_64-setup.run
          ./zephyr-sdk-$ZEPHYR_SDK_VERSION-linux-x86_64-setup.run -- -d /opt/zephyr-sdk

      # 4️⃣ Initialize Zephyr workspace
      - name: Initialize West workspace
        run: |
          west init -l app
          west update

      # 5️⃣ Set environment variables for Zephyr
      - name: Set Zephyr environment
        run: |
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> $GITHUB_ENV
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk" >> $GITHUB_ENV

      # 6️⃣ Build the BLE Beacon app
      - name: Build BLE Beacon
        run: |
          west build -p always -b esp32_devkitc app/BLE_Beacon

      # 7️⃣ Upload generated firmware
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: build/zephyr/*.bin
