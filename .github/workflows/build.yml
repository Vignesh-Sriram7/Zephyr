name: Build ESP32 BLE Beacon
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler ninja-build gperf

      - name: Setup Zephyr and SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 0.17.0
          # We tell the action to install the specific xtensa toolchain for us
          toolchains: xtensa-esp32-elf 

      - name: Build BLE Beacon
        run: |
          # The action sets ZEPHYR_SDK_INSTALL_DIR automatically.
          # We just need to specify the variant.
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          
          west build -p always -b esp32_devkitc/esp32/procpu app/BLE_Beacon

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: build/zephyr/zephyr.bin
