name: Build ESP32 BLE Beacon
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler ninja-build gperf wget xz-utils

      - name: Setup Zephyr Project
        run: |
          pip install west
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.0.0 zephyrproject
          cd zephyrproject
          west update
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK (Minimal + Xtensa)
        run: |
          cd $HOME
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xvf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          cd zephyr-sdk-0.17.0
          # Install ONLY the xtensa toolchain to save time
          ./setup.sh -t xtensa-zephyr-elf -h -c

      - name: Build BLE Beacon
        run: |
          export ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.0
          cd zephyrproject
          west build -p always -b esp32_devkitc/esp32/procpu ../app/BLE_Beacon

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: zephyrproject/build/zephyr/zephyr.bin
