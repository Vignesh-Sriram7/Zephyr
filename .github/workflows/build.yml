name: Build ESP32 BLE Beacon

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Zephyr Base (No Toolchains here)
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          sdk-version: 0.17.0
          # We leave toolchains EMPTY to let the action finish successfully

      - name: Manual Toolchain Install
        run: |
          # 1. Go to the SDK folder created by the action
          cd $HOME/zephyr-sdk-0.17.0
          
          # 2. Run the SDK's own installer for the ESP32 compiler
          # This is the "real" way to get xtensa-espressif-elf
          ./setup.sh -t xtensa-espressif-elf -c

      - name: Build BLE Beacon
        run: |
          # Tell CMake exactly where the SDK and the Variant are
          export ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.0
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          
          # Build using the new board name
          west build -p always -b esp32_devkitc/esp32/procpu app/BLE_Beacon
          
      - name: Upload Flashable Binary
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Beacon-Firmware
          path: |
            build/zephyr/zephyr.bin
            build/zephyr/merged.bin
