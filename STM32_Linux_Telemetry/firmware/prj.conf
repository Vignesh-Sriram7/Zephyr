# General
CONFIG_LOG=y
CONFIG_PRINTK=y

# Enable the GPIO and the sensor drivers
CONFIG_GPIO=y  
#CONFIG_SENSOR=y
#CONFIG_DHT=y

# Enable the STM32 console and USART dependencies
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y

#Enable the CDC
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y

#To enable floating point computing directly to cbprintf
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MINIMAL_LIBC=n
CONFIG_PICOLIBC=y
