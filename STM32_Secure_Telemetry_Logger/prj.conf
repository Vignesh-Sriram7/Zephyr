# General
CONFIG_LOG=y
CONFIG_PRINTK=y

# Enable the I2C, PINCTRL and the sensor drivers
CONFIG_I2C=y  
CONFIG_PINCTRL=y 
CONFIG_SENSOR=y
CONFIG_BME280=y

# Enable the STM32 console and USART dependencies
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y

# Flash storage and persistence with NVS
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# Enable RNG drivers
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y


CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_SHA256=y